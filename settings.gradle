pluginManagement {
    repositories {
        maven {
            name 'GTNH Maven'   // RetroFuturaGradle lives here, not on Maven Central
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle DOWNLOAD its own JDK 8 toolchain, so the build works on a box that only
    // has a modern JDK.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mc-worldleak-fix'
